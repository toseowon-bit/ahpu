name: Deploy demo to CloudFront
# main에 병합되면 테스트 후 데모를 S3 + CloudFront에 배포한다. 수동 실행(Run workflow)도 가능.
# AWS 키를 저장하지 않는다: GitHub OIDC로 이 저장소 main 브랜치에서만 임시 권한을 받는다.
# 설정 전(저장소 변수 AWS_DEPLOY_ROLE_ARN 없음)에는 배포 작업을 건너뛴다. 설정 방법: docs/DEPLOY_AWS.md
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'scripts/build-demo-static.js'
      - 'scripts/deploy-demo-s3.sh'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write   # OIDC 토큰 발급(AWS 임시 권한 요청)에만 필요
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Test before deploy
        run: npm run check
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
          role-session-name: ahpu-demo-deploy-${{ github.run_id }}
      - name: Deploy
        env:
          DEMO_BUCKET: ${{ vars.DEMO_BUCKET || 'ahpu-demo-6a0deb' }}
          DEMO_WAIT: '1'
        run: scripts/deploy-demo-s3.sh

  not-configured:
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN == '' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "::notice::AWS_DEPLOY_ROLE_ARN 저장소 변수가 없어 배포를 건너뜁니다. docs/DEPLOY_AWS.md를 참고해 설정하세요."
